name: Native batches
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install . --group test
      - name: Build independent provider and run Python checks
        shell: bash
        run: |
          prefix=$(python -c 'import correctionlib,pathlib; print(pathlib.Path(correctionlib.__file__).parent)')
          cmake -S tests/batch_provider -B /tmp/batch-provider -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/batch-provider -j2
          export BATCH_PROBE_LIBRARY=/tmp/batch-provider/libbatch_probe.so
          python -m pytest tests/test_native_batches.py
      - name: Python-free core and independent provider
        shell: bash
        run: |
          cmake -S . -B /tmp/native-batches -DCORRECTIONLIB_BUILD_PYTHON=OFF -DCORRECTIONLIB_BUILD_TESTS=ON -DBUILD_DEMO=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/batch-install
          cmake --build /tmp/native-batches -j2
          cmake --install /tmp/native-batches
          cmake -S tests/batch_provider -B /tmp/native-batch-provider -DCMAKE_PREFIX_PATH=/tmp/batch-install/correctionlib -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/native-batch-provider -j2
          cmake -S . -B /tmp/native-batches -DBATCH_PROBE_LIBRARY=/tmp/native-batch-provider/libbatch_probe.so
          ctest --test-dir /tmp/native-batches --output-on-failure
